<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Вход в приложение — Дневник Читателя</title>
</head>
<body>
  <main class="appAuthPage">
    <section class="appAuthCard">
      <span class="brandMark">RD</span>
      <h1>Вход в «Дневник Читателя»</h1>
      <p id="appAuthLead">Подтвердите вход. Пароль Google или VK не передаётся приложению.</p>
      <div id="appGoogleButton" class="googleAuthButton"></div>
      <button id="appVkButton" class="vkAuthButton" type="button" hidden><span class="vkAuthMark">VK</span><span>Продолжить с VK ID</span></button>
      <div id="appAuthState" class="paymentState" role="status" aria-live="polite">Загрузка безопасного входа…</div>
      <a href="/premium.html" class="secondaryButton">Вернуться на сайт</a>
    </section>
  </main>
  <script src="/social-auth-config.js"></script>
  <script src="/app-auth.js" defer></script>
</body>
</html>
